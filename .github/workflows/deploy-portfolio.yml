name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source with full photographic assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify original imagery, cotton film and fonts
        run: |
          git lfs pull
          node scripts/check-portfolio-assets.mjs
          node -e 'const fs=require("node:fs"); for (const n of ["cotton-studio.webp","cotton-studio-small.webp"]) { const b=fs.readFileSync("src/assets/"+n); if (b.toString("ascii",0,4)!=="RIFF" || b.toString("ascii",8,12)!=="WEBP") throw Error(n+" is not a decoded WebP"); }'


      - name: Build portfolio for GitHub Pages
        run: |
          cp deploy/github-index.html index.html
          pnpm exec vite build --config vite.config.ts --base /

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
